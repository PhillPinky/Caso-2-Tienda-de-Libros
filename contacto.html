  <main>
    <section class="contacto-section">
      <h1>Formulario de Contacto</h1>

      <form id="form-contacto" novalidate>

        <div class="form-group">
          <label for="contacto-nombre">Nombre completo</label>
          <input type="text" id="contacto-nombre" name="nombre" required
                 maxlength="100" placeholder="Tu nombre">
          <span class="error-msg" id="error-contacto-nombre"></span>
        </div>

        <div class="form-group">
          <label for="contacto-correo">Correo electrónico</label>
          <input type="email" id="contacto-correo" name="correo" required
                 maxlength="100" placeholder="nombre@duoc.cl">
          
          <span class="error-msg" id="error-contacto-correo"></span>
        </div>

        <div class="form-group">
          <label for="contacto-comentario">Comentario</label>
          <textarea id="contacto-comentario" name="comentario" required
                    maxlength="500" rows="5"
                    placeholder="Escribe tu mensaje (máx. 500 caracteres)"></textarea>
          <span class="error-msg" id="error-contacto-comentario"></span>
        </div>

        <button type="submit" id="btn-enviar-contacto">Enviar mensaje</button>

      </form>
    </section>
  </main>
