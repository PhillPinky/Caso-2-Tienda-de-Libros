  <main>
    <section class="login-section">
      <img src="img/logo.png" alt="Logo Gourmet Hub" class="login-logo">
      <h1>Gourmet Hub</h1>

      <form id="form-login" novalidate>

        <div class="form-group">
          <label for="login-correo">Correo electrónico</label>
          <input type="email" id="login-correo" name="correo" required
                 maxlength="100"
                 placeholder="nombre@duoc.cl">
          <span class="error-msg" id="error-login-correo"></span>
        </div>

        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input type="password" id="login-password" name="password" required
                 minlength="4" maxlength="10"
                 placeholder="Entre 4 y 10 caracteres">
          <span class="error-msg" id="error-login-password"></span>
        </div>

        <button type="submit" id="btn-login">Iniciar sesión</button>

      </form>
    </section>
  </main>
