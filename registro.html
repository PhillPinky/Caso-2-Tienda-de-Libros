</head>
<body>

  <header>

        <img src="img/logo.png" alt="Logo Gourmet Hub">
        <span>Gourmet Hub</span>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>

        </ul>

        <a href="carrito.html" class="cart-link"> Carrito :3!! (<span id="cart-count">0</span>)</a>
    </header>


  <main>
    <section class="registro-section">
      <h1>Registro de Usuario</h1>

      <form id="form-registro" novalidate>

      
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required
                 minlength="3" maxlength="70"
                 placeholder="Ej: María Pérez">
          <span class="error-msg" id="error-nombre"></span>
        </div>

        <div class="form-group">
          <label for="correo">Correo electrónico (institucional @duoc.cl)</label>
          <input type="email" id="correo" name="correo" required
                 maxlength="60"
                 placeholder="nombre@duoc.cl">
          <span class="error-msg" id="error-correo"></span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required
                 minlength="10"
                 placeholder="Mínimo 10 caracteres">
          <span class="error-msg" id="error-password"></span>
        </div>

        <div class="form-group">
          <label for="password-confirm">Confirmar contraseña</label>
          <input type="password" id="password-confirm" name="password-confirm" required>
          <span class="error-msg" id="error-password-confirm"></span>
        </div>

        <fieldset class="form-group">
          <legend>Restricciones alimentarias</legend>

          <label><input type="checkbox" name="restriccion" value="celiaco"> Celíaco</label>
          <label><input type="checkbox" name="restriccion" value="vegano"> Vegano</label>
          <label><input type="checkbox" name="restriccion" value="vegetariano"> Vegetariano</label>
          <label><input type="checkbox" name="restriccion" value="lactosa"> Intolerante a la Lactosa</label>
          <label><input type="checkbox" name="restriccion" value="frutos-secos"> Frutos Secos</label>
          <label><input type="checkbox" name="restriccion" value="ninguna" id="restriccion-ninguna"> Ninguna</label>
          <span class="error-msg" id="error-restriccion"></span>
        </fieldset>

        <fieldset class="form-group">
          <legend>Recetas de interés</legend>

          <div id="recetas-container">
          </div>

          <button type="button" id="btn-agregar-receta">+ Agregar receta de interés</button>
          <span class="error-msg" id="error-recetas"></span>
        </fieldset>

        <template id="template-receta">
          <div class="receta-item">
            <label>
              Categoría
              <select name="categoria-receta" required>
                <option value=""> Seleccione </option>
                <option value="pasteleria">Pastelería</option>
                <option value="cocina-italiana">Cocina Italiana</option>
                <option value="reposteria">Repostería</option>
                <option value="cocina-oriental">Cocina Oriental</option>
                <option value="barismo">Barismo</option>
              </select>
            </label>

            <span>Nivel de experiencia:</span>
            <label><input type="radio" name="nivel-receta" value="principiante" required> Principiante</label>
            <label><input type="radio" name="nivel-receta" value="intermedio"> Intermedio</label>
            <label><input type="radio" name="nivel-receta" value="avanzado"> Avanzado</label>

            <button type="button" class="btn-quitar-receta">Quitar</button>
          </div>
        </template>

        <button type="submit" id="btn-registrar">Registrar</button>

      </form>
    </section>
  </main>

  <script src="js/registro.js"></script>

</html>
