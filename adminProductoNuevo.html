<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - Gourmet Hub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="admin-logo">Gourmet Hub Admin</div>
      <nav>
        <ul>
          <li><a href="adminHome.html">Inicio</a></li>
          <li><a href="adminProductos.html">Productos</a></li>
          <li><a href="adminUsuarios.html">Usuarios</a></li>
        </ul>
      </nav>
      <a href="index.html" class="admin-salir">&larr; Salir al sitio</a>
    </aside>

    <main class="admin-content">
      <header class="admin-topbar">
        <h1>Nuevo Producto</h1>
      </header>

      <form id="form-producto" class="admin-form" novalidate>

        <div class="form-group">
          <label for="prod-codigo">Código producto</label>
          <input type="text" id="prod-codigo" name="codigo" required minlength="3">
        </div>

        <div class="form-group">
          <label for="prod-nombre">Nombre</label>
          <input type="text" id="prod-nombre" name="nombre" required maxlength="100">
        </div>

        <div class="form-group">
          <label for="prod-descripcion">Descripción</label>
          <textarea id="prod-descripcion" name="descripcion" maxlength="500"></textarea>
        </div>

        <div class="form-group">
          <label for="prod-precio">Precio</label>
          <input type="number" id="prod-precio" name="precio" required min="0" step="0.01">
        </div>

        <div class="form-group">
          <label for="prod-stock">Stock</label>
          <input type="number" id="prod-stock" name="stock" required min="0" step="1">
        </div>

        <div class="form-group">
          <label for="prod-stock-critico">Stock crítico</label>
          <input type="number" id="prod-stock-critico" name="stock-critico" min="0" step="1">
        </div>

        <div class="form-group">
          <label for="prod-categoria">Categoría</label>
          <select id="prod-categoria" name="categoria" required>
            <option value="">-- Seleccione --</option>
            <option value="aceites">Aceites</option>
            <option value="condimentos">Condimentos</option>
            <option value="cafe">Café</option>
            <option value="dulces">Dulces</option>
            <option value="pastas">Pastas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="prod-imagen">Imagen</label>
          <input type="file" id="prod-imagen" name="imagen" accept="image/*">
        </div>

        <button type="submit">Guardar Producto</button>
      </form>
    </main>

  </div>

</body>
</html>
